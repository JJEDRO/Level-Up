<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 Forge Quiz - Battle of Knowledge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d0a0a 50%, #1a1a1a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Fire Animation Background */
        @keyframes flicker {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        .fire-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 100%, rgba(255, 69, 0, 0.3) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: flicker 3s ease-in-out infinite;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: linear-gradient(135deg, rgba(255, 69, 0, 0.3), rgba(255, 140, 0, 0.2));
            border-radius: 20px;
            border: 3px solid #ff4500;
            box-shadow: 0 0 30px rgba(255, 69, 0, 0.5);
        }

        .title {
            font-size: 3.5rem;
            text-shadow: 0 0 20px #ff4500, 0 0 40px #ff6600;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff4500, #ffa500, #ff4500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: flicker 2s ease-in-out infinite;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #ffa500;
            text-shadow: 0 0 10px rgba(255, 165, 0, 0.8);
        }

        /* Game Status */
        .game-status {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            border: 2px solid #ff6600;
        }

        .team-score {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            border: 3px solid;
        }

        .team-blue {
            background: linear-gradient(135deg, rgba(0, 100, 255, 0.3), rgba(0, 150, 255, 0.2));
            border-color: #0066ff;
            box-shadow: 0 0 20px rgba(0, 100, 255, 0.5);
        }

        .team-red {
            background: linear-gradient(135deg, rgba(255, 0, 0, 0.3), rgba(255, 100, 0, 0.2));
            border-color: #ff3300;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        .team-score.active {
            transform: scale(1.05);
            box-shadow: 0 0 40px currentColor;
        }

        .team-name {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .team-points {
            font-size: 3rem;
            font-weight: bold;
            color: #ffa500;
            text-shadow: 0 0 10px currentColor;
        }

        .turn-indicator {
            text-align: center;
            padding: 20px;
            background: rgba(255, 140, 0, 0.2);
            border-radius: 10px;
            border: 2px solid #ff8c00;
        }

        .current-turn {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .timer {
            font-size: 3rem;
            font-weight: bold;
            color: #ff4500;
            text-shadow: 0 0 20px #ff4500;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Question Board */
        .question-board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .question-card {
            background: linear-gradient(135deg, rgba(255, 69, 0, 0.4), rgba(255, 140, 0, 0.3));
            border: 3px solid #ff6600;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .question-card:hover:not(.answered) {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 10px 40px rgba(255, 69, 0, 0.7);
            border-color: #ff4500;
        }

        .question-card.answered {
            background: rgba(50, 50, 50, 0.5);
            border-color: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .question-points {
            font-size: 3rem;
            font-weight: bold;
            color: #ffa500;
            text-shadow: 0 0 15px #ff6600;
        }

        .question-label {
            font-size: 0.9rem;
            color: #ffcc00;
            margin-top: 10px;
        }

        /* Question Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #2d0a0a 0%, #1a1a1a 100%);
            border: 4px solid #ff4500;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 90%;
            box-shadow: 0 0 50px rgba(255, 69, 0, 0.8);
            position: relative;
        }

        .question-display {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 30px;
            color: #ffa500;
            text-shadow: 0 0 15px rgba(255, 165, 0, 0.8);
            line-height: 1.5;
        }

        .answer-input {
            width: 100%;
            padding: 20px;
            font-size: 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid #ff6600;
            border-radius: 10px;
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
        }

        .answer-input:focus {
            outline: none;
            border-color: #ff4500;
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.5);
        }

        .submit-btn {
            width: 100%;
            padding: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ff4500, #ff8c00);
            border: none;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .submit-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 69, 0, 0.8);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 2rem;
            color: #ff4500;
            cursor: pointer;
            background: none;
            border: none;
            width: 40px;
            height: 40px;
            line-height: 40px;
            text-align: center;
        }

        /* Feedback */
        .feedback {
            display: none;
            text-align: center;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .feedback.correct {
            background: rgba(0, 255, 0, 0.2);
            border: 3px solid #00ff00;
            color: #00ff00;
            display: block;
        }

        .feedback.incorrect {
            background: rgba(255, 0, 0, 0.2);
            border: 3px solid #ff0000;
            color: #ff0000;
            display: block;
        }

        /* Game Over */
        .game-over {
            display: none;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, rgba(255, 69, 0, 0.5), rgba(255, 140, 0, 0.3));
            border: 4px solid #ff4500;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(255, 69, 0, 0.8);
        }

        .game-over.active {
            display: block;
        }

        .winner-text {
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px currentColor;
        }

        .final-score {
            font-size: 2rem;
            margin-bottom: 30px;
            color: #ffa500;
        }

        .restart-btn {
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ff4500, #ff8c00);
            border: none;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .restart-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 69, 0, 0.8);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }

            .game-status {
                grid-template-columns: 1fr;
            }

            .question-board {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            }

            .question-points {
                font-size: 2rem;
            }

            .modal-content {
                padding: 20px;
            }

            .question-display {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="fire-bg"></div>
    
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1 class="title">🔥 FORGE QUIZ 🔥</h1>
            <p class="subtitle">Battle of Knowledge - Forged in Fire</p>
        </div>

        <!-- Game Status -->
        <div class="game-status">
            <div class="team-score team-blue" id="team-blue-score">
                <div class="team-name">🔵 Team Blue</div>
                <div class="team-points" id="blue-points">0</div>
            </div>

            <div class="turn-indicator">
                <div class="current-turn" id="current-turn">Team Blue's Turn</div>
                <div class="timer" id="timer">30</div>
            </div>

            <div class="team-score team-red" id="team-red-score">
                <div class="team-name">🔴 Team Red</div>
                <div class="team-points" id="red-points">0</div>
            </div>
        </div>

        <!-- Question Board -->
        <div class="question-board" id="question-board"></div>

        <!-- Game Over -->
        <div class="game-over" id="game-over">
            <div class="winner-text" id="winner-text"></div>
            <div class="final-score" id="final-score"></div>
            <button class="restart-btn" onclick="restartGame()">🔥 Play Again 🔥</button>
        </div>
    </div>

    <!-- Question Modal -->
    <div class="modal" id="question-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">×</button>
            <div class="question-display" id="question-text"></div>
            <input type="text" class="answer-input" id="answer-input" placeholder="Type your answer here..." autocomplete="off">
            <button class="submit-btn" onclick="checkAnswer()">🔥 Submit Answer 🔥</button>
            <div class="feedback" id="feedback"></div>
        </div>
    </div>

    <script>
        // Game State
        const gameState = {
            currentTeam: 'blue',
            blueScore: 0,
            redScore: 0,
            answeredQuestions: new Set(),
            currentQuestion: null,
            timerInterval: null,
            timeRemaining: 30
        };

        // Questions (all related to "forged" theme)
        const questions = [
            {
                id: 1,
                points: 100,
                question: "What does 'forged' mean in metalworking?",
                answer: ["shaped", "formed", "hammered", "created"],
                correctAnswer: "Shaped or formed metal by heating and hammering"
            },
            {
                id: 2,
                points: 200,
                question: "Complete the phrase: 'A friendship forged in...'",
                answer: ["fire", "battle", "hardship", "adversity"],
                correctAnswer: "Fire (or battle/adversity)"
            },
            {
                id: 3,
                points: 300,
                question: "What is a famous TV show about bladesmiths who forge weapons?",
                answer: ["forged in fire", "forged", "fire"],
                correctAnswer: "Forged in Fire"
            },
            {
                id: 4,
                points: 400,
                question: "In metalworking, what temperature range is steel typically forged at? (in Fahrenheit, just the number)",
                answer: ["2000", "2100", "2200", "2300", "2400"],
                correctAnswer: "2000-2400°F"
            },
            {
                id: 5,
                points: 500,
                question: "What does it mean when someone 'forges ahead'?",
                answer: ["continues", "moves forward", "persists", "advances", "pushes forward"],
                correctAnswer: "To move forward or continue despite difficulties"
            },
            {
                id: 6,
                points: 600,
                question: "What crime involves creating a forged document?",
                answer: ["forgery", "counterfeiting", "fraud"],
                correctAnswer: "Forgery"
            },
            {
                id: 7,
                points: 700,
                question: "In the Lord of the Rings, where was the One Ring forged?",
                answer: ["mount doom", "mordor", "doom"],
                correctAnswer: "Mount Doom (in Mordor)"
            }
        ];

        // Initialize Game
        function initGame() {
            renderQuestionBoard();
            updateDisplay();
            startTimer();
        }

        // Render Question Board
        function renderQuestionBoard() {
            const board = document.getElementById('question-board');
            board.innerHTML = '';
            
            questions.forEach(q => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `question-${q.id}`;
                
                if (gameState.answeredQuestions.has(q.id)) {
                    card.classList.add('answered');
                }
                
                card.innerHTML = `
                    <div class="question-points">${q.points}</div>
                    <div class="question-label">Points</div>
                `;
                
                if (!gameState.answeredQuestions.has(q.id)) {
                    card.onclick = () => openQuestion(q.id);
                }
                
                board.appendChild(card);
            });
        }

        // Open Question
        function openQuestion(questionId) {
            const question = questions.find(q => q.id === questionId);
            if (!question) return;
            
            gameState.currentQuestion = question;
            
            document.getElementById('question-text').textContent = question.question;
            document.getElementById('answer-input').value = '';
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('question-modal').classList.add('active');
            document.getElementById('answer-input').focus();
            
            // Pause main timer
            if (gameState.timerInterval) {
                clearInterval(gameState.timerInterval);
            }
            
            // Start question timer
            gameState.timeRemaining = 30;
            updateTimer();
            gameState.timerInterval = setInterval(() => {
                gameState.timeRemaining--;
                updateTimer();
                
                if (gameState.timeRemaining <= 0) {
                    clearInterval(gameState.timerInterval);
                    handleWrongAnswer();
                }
            }, 1000);
        }

        // Check Answer
        function checkAnswer() {
            const userAnswer = document.getElementById('answer-input').value.toLowerCase().trim();
            const question = gameState.currentQuestion;
            
            if (!userAnswer) return;
            
            // Check if answer is correct
            const isCorrect = question.answer.some(ans => 
                userAnswer.includes(ans.toLowerCase())
            );
            
            clearInterval(gameState.timerInterval);
            
            if (isCorrect) {
                handleCorrectAnswer();
            } else {
                handleWrongAnswer();
            }
        }

        // Handle Correct Answer
        function handleCorrectAnswer() {
            const question = gameState.currentQuestion;
            
            // Add points to current team
            if (gameState.currentTeam === 'blue') {
                gameState.blueScore += question.points;
            } else {
                gameState.redScore += question.points;
            }
            
            // Mark question as answered
            gameState.answeredQuestions.add(question.id);
            
            // Show feedback
            const feedback = document.getElementById('feedback');
            feedback.textContent = `🔥 CORRECT! +${question.points} points! 🔥`;
            feedback.className = 'feedback correct';
            
            setTimeout(() => {
                closeModal();
                
                // Check if game is over
                if (gameState.answeredQuestions.size === questions.length) {
                    endGame();
                } else {
                    // Same team continues
                    startTimer();
                }
            }, 2000);
            
            updateDisplay();
            renderQuestionBoard();
        }

        // Handle Wrong Answer
        function handleWrongAnswer() {
            const question = gameState.currentQuestion;
            
            // Show feedback
            const feedback = document.getElementById('feedback');
            feedback.textContent = `❌ WRONG! Correct answer: ${question.correctAnswer}`;
            feedback.className = 'feedback incorrect';
            
            setTimeout(() => {
                closeModal();
                
                // Switch teams
                gameState.currentTeam = gameState.currentTeam === 'blue' ? 'red' : 'blue';
                
                // Check if game is over
                if (gameState.answeredQuestions.size === questions.length) {
                    endGame();
                } else {
                    startTimer();
                }
            }, 3000);
            
            updateDisplay();
        }

        // Close Modal
        function closeModal() {
            document.getElementById('question-modal').classList.remove('active');
            if (gameState.timerInterval) {
                clearInterval(gameState.timerInterval);
            }
        }

        // Start Timer
        function startTimer() {
            if (gameState.timerInterval) {
                clearInterval(gameState.timerInterval);
            }
            
            gameState.timeRemaining = 30;
            updateTimer();
            
            gameState.timerInterval = setInterval(() => {
                gameState.timeRemaining--;
                updateTimer();
                
                if (gameState.timeRemaining <= 0) {
                    clearInterval(gameState.timerInterval);
                    // Switch teams on timeout
                    gameState.currentTeam = gameState.currentTeam === 'blue' ? 'red' : 'blue';
                    updateDisplay();
                    startTimer();
                }
            }, 1000);
        }

        // Update Timer Display
        function updateTimer() {
            document.getElementById('timer').textContent = gameState.timeRemaining;
        }

        // Update Display
        function updateDisplay() {
            document.getElementById('blue-points').textContent = gameState.blueScore;
            document.getElementById('red-points').textContent = gameState.redScore;
            
            const turnText = gameState.currentTeam === 'blue' ? "🔵 Team Blue's Turn" : "🔴 Team Red's Turn";
            document.getElementById('current-turn').textContent = turnText;
            
            // Highlight active team
            const blueTeam = document.getElementById('team-blue-score');
            const redTeam = document.getElementById('team-red-score');
            
            if (gameState.currentTeam === 'blue') {
                blueTeam.classList.add('active');
                redTeam.classList.remove('active');
            } else {
                redTeam.classList.add('active');
                blueTeam.classList.remove('active');
            }
        }

        // End Game
        function endGame() {
            clearInterval(gameState.timerInterval);
            
            const gameOver = document.getElementById('game-over');
            const winnerText = document.getElementById('winner-text');
            const finalScore = document.getElementById('final-score');
            
            if (gameState.blueScore > gameState.redScore) {
                winnerText.textContent = "🔵 TEAM BLUE WINS! 🔵";
                winnerText.style.color = "#0066ff";
            } else if (gameState.redScore > gameState.blueScore) {
                winnerText.textContent = "🔴 TEAM RED WINS! 🔴";
                winnerText.style.color = "#ff3300";
            } else {
                winnerText.textContent = "🤝 IT'S A TIE! 🤝";
                winnerText.style.color = "#ffa500";
            }
            
            finalScore.textContent = `Final Score - Blue: ${gameState.blueScore} | Red: ${gameState.redScore}`;
            
            gameOver.classList.add('active');
            document.getElementById('question-board').style.display = 'none';
        }

        // Restart Game
        function restartGame() {
            gameState.currentTeam = 'blue';
            gameState.blueScore = 0;
            gameState.redScore = 0;
            gameState.answeredQuestions.clear();
            gameState.currentQuestion = null;
            gameState.timeRemaining = 30;
            
            document.getElementById('game-over').classList.remove('active');
            document.getElementById('question-board').style.display = 'grid';
            
            initGame();
        }

        // Handle Enter key in answer input
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('answer-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    checkAnswer();
                }
            });
        });

        // Initialize game on load
        initGame();
    </script>
</body>
</html>
